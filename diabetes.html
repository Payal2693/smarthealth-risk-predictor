{% extends "base.html" %}
{% block title %}Diabetes Check{% endblock %}
{% block content %}
<h1 class="section-title"><i class="fa-solid fa-droplet text-primary me-2"></i>Diabetes Risk Assessment</h1>
<p class="text-muted mb-4">Fill in your health details below. This is a screening tool, not a medical diagnosis.</p>

<div class="card card-app" style="max-width: 700px;">
    <div class="card-body">
        <form method="POST" action="{{ url_for('predict_diabetes') }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Number of Pregnancies</label>
                    <input type="number" name="pregnancies" class="form-control" min="0" placeholder="0 if not applicable" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Age</label>
                    <input type="number" name="age" class="form-control" min="1" max="120" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Glucose Level (mg/dL)</label>
                    <input type="number" step="0.1" name="glucose" class="form-control" placeholder="e.g. 120" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Blood Pressure (mm Hg)</label>
                    <input type="number" step="0.1" name="blood_pressure" class="form-control" placeholder="e.g. 70" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Skin Thickness (mm)</label>
                    <input type="number" step="0.1" name="skin_thickness" class="form-control" placeholder="e.g. 20" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Insulin Level (mu U/ml)</label>
                    <input type="number" step="0.1" name="insulin" class="form-control" placeholder="e.g. 80" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">BMI</label>
                    <input type="number" step="0.1" name="bmi" class="form-control" placeholder="e.g. 25.5" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Diabetes Pedigree Function</label>
                    <input type="number" step="0.001" name="diabetes_pedigree" class="form-control" placeholder="e.g. 0.5" required>
                    <small class="text-muted">A score reflecting family history of diabetes (typically 0.08&ndash;2.5)</small>
                </div>
            </div>
            <button type="submit" class="btn btn-sh w-100 py-2 mt-4">
                <i class="fa-solid fa-magnifying-glass-chart me-2"></i>Run Assessment
            </button>
        </form>
    </div>
</div>
{% endblock %}
