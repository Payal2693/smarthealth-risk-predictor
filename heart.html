{% extends "base.html" %}
{% block title %}Heart Disease Check{% endblock %}
{% block content %}
<h1 class="section-title"><i class="fa-solid fa-heart-pulse text-danger me-2"></i>Heart Disease Risk Assessment</h1>
<p class="text-muted mb-4">Fill in your clinical details below. This is a screening tool, not a medical diagnosis.</p>

<div class="card card-app" style="max-width: 780px;">
    <div class="card-body">
        <form method="POST" action="{{ url_for('predict_heart') }}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Age</label>
                    <input type="number" name="age" class="form-control" min="1" max="120" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Sex</label>
                    <select name="sex" class="form-select" required>
                        <option value="1">Male</option>
                        <option value="0">Female</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Chest Pain Type</label>
                    <select name="cp" class="form-select" required>
                        <option value="0">Typical Angina</option>
                        <option value="1">Atypical Angina</option>
                        <option value="2">Non-Anginal Pain</option>
                        <option value="3">Asymptomatic</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Resting Blood Pressure (mm Hg)</label>
                    <input type="number" step="0.1" name="trestbps" class="form-control" placeholder="e.g. 120" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Serum Cholesterol (mg/dl)</label>
                    <input type="number" step="0.1" name="chol" class="form-control" placeholder="e.g. 200" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Fasting Blood Sugar &gt; 120 mg/dl?</label>
                    <select name="fbs" class="form-select" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Resting ECG Results</label>
                    <select name="restecg" class="form-select" required>
                        <option value="0">Normal</option>
                        <option value="1">ST-T Wave Abnormality</option>
                        <option value="2">Left Ventricular Hypertrophy</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Max Heart Rate Achieved</label>
                    <input type="number" step="0.1" name="thalach" class="form-control" placeholder="e.g. 150" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Exercise Induced Angina?</label>
                    <select name="exang" class="form-select" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">ST Depression (oldpeak)</label>
                    <input type="number" step="0.1" name="oldpeak" class="form-control" placeholder="e.g. 1.0" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Slope of Peak Exercise ST</label>
                    <select name="slope" class="form-select" required>
                        <option value="0">Upsloping</option>
                        <option value="1">Flat</option>
                        <option value="2">Downsloping</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Major Vessels Colored (ca)</label>
                    <select name="ca" class="form-select" required>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Thalassemia (thal)</label>
                    <select name="thal" class="form-select" required>
                        <option value="1">Normal</option>
                        <option value="2">Fixed Defect</option>
                        <option value="3">Reversible Defect</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-sh w-100 py-2 mt-4">
                <i class="fa-solid fa-magnifying-glass-chart me-2"></i>Run Assessment
            </button>
        </form>
    </div>
</div>
{% endblock %}
