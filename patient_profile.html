{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h1 class="section-title mb-4">My Profile</h1>

<div class="card card-app" style="max-width: 600px;">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email (read-only)</label>
                    <input type="email" class="form-control" value="{{ user.email }}" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Age</label>
                    <input type="number" name="age" class="form-control" min="1" max="120" value="{{ user.age or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="">Select</option>
                        {% for g in ['Male','Female','Other'] %}
                        <option {{ 'selected' if user.gender == g else '' }}>{{ g }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Account Type</label>
                    <input type="text" class="form-control" value="{{ user.role|capitalize }}" readonly>
                </div>
            </div>
            <button type="submit" class="btn btn-sh mt-4 px-4">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
